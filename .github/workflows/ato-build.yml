on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "elec/**"
      - "ato.yaml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: atopile/setup-atopile@main
        with:
          # FIXME: peg to something better
          version: main

      - run: ato build

      - name: Upload Combined Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: build
