name: docs
on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  release:
    types: [published]

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - run: echo "${{ github.event_name }}"
        name: event_name
      - run: echo "${{ github.event.ref }}"
        name: ref
      - run: echo "${{ github.event.release.prerelease }}"
        name: prerelease
      - run: echo "${{ github.event.release.draft }}"
        name: draft

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required for mike to work with git history

      - name: Check Links
        uses: lycheeverse/lychee-action@v2
        with:
          args: -c docs/lychee.toml docs/

      - name: Spellcheck
        uses: streetsidesoftware/cspell-action@v6
        with:
          files: docs/**/*.md

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: 'docs/pyproject.toml'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: '0.6.4'
          enable-cache: true
          cache-dependency-glob: "docs/uv.lock"

      - run: uv run mkdocs build --strict
        working-directory: docs

  deploy:
    if: (github.event_name == 'push' && github.event.ref == 'refs/heads/main') || (github.event_name == 'release' && !github.event.release.draft)
    environment: github-pages
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: 'docs/pyproject.toml'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: '0.6.4'
          enable-cache: true
          cache-dependency-glob: "docs/uv.lock"

      - uses: actions/configure-pages@v5

      - run: uv run mkdocs build
        working-directory: docs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs/site'

      - uses: actions/deploy-pages@v4
