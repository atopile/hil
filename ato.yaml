requires-atopile: ">=0.4.0"

builds:
  # Project Examples
  # cellsim-16ch:
  #   entry: examples/cellsim/cellsim-16ch.ato:CellSim16Ch
  #   exclude_checks:
  #   - PCB.requires_drc_check

  # canjay:
  #   entry: examples/canjay/canjay.ato:Canjay

  # IO Blocks
  # hil-core:
  #   entry: elec/src/blocks/hil-core.ato:HILCore
  #   exclude_targets: [mfg-data]
  #   exclude_checks:
  #     - I2C.requires_unique_addresses
  #     - requires_external_usage

  coms-can-iso:
    entry: elec/src/blocks/coms-can.ato:ComsCANISO
    exclude_targets: [mfg-data]
    exclude_checks:
      - I2C.requires_unique_addresses
      - requires_external_usage

  cell:
    entry: elec/src/components/cell.ato:Cell
    exclude_targets: [mfg-data]
    exclude_checks:
      - I2C.requires_unique_addresses
      - requires_external_usage

  cellsim-8ch:
    entry: elec/src/blocks/cellsim-8ch.ato:CellSim8Ch
    exclude_targets: [mfg-data]
    exclude_checks:
      - I2C.requires_unique_addresses
      - requires_external_usage

  # Controllers and Interconnect
  controller-cm5:
    entry: elec/src/blocks/controller-cm5.ato:ControllerCM5
    exclude_targets: [mfg-data]
    exclude_checks:
      - I2C.requires_unique_addresses
      - requires_external_usage

  oled-128-32:
    entry: elec/src/blocks/oled-128-32.ato:OLED12832
    exclude_targets: [mfg-data]
    exclude_checks:
      - I2C.requires_unique_addresses
      - requires_external_usage

  usb-uart-bridge:
    entry: elec/src/blocks/usb-uart-bridge.ato:UsbUartBridge
    exclude_targets: [mfg-data]
    exclude_checks:
      - I2C.requires_unique_addresses
      - requires_external_usage

  usb2-hub:
    entry: elec/src/blocks/usb2-hub.ato:USB2Hub
    exclude_targets: [mfg-data]
    exclude_checks:
      - I2C.requires_unique_addresses
      - requires_external_usage

  usb251b:
    entry: elec/src/components/microchip_tech_us_b2514b_im2.ato:Microchip_Tech_USB2514B_I_M2
    exclude_targets: [mfg-data]
    exclude_checks:
      - I2C.requires_unique_addresses
      - requires_external_usage

  ref5050aidr:
    entry: elec/src/components/texas_instruments_ref5050aidr.ato:Texas_Instruments_REF5050AIDR
    exclude_targets: [mfg-data]
    exclude_checks:
      - I2C.requires_unique_addresses
      - requires_external_usage

  # black-magic-debugger:
  #   entry: elec/src/blocks/black_magic_debugger.ato:BlackMagicDebugger
  #   exclude_targets: [mfg-data]
  #   exclude_checks:
  #     - I2C.requires_unique_addresses
  #     - requires_external_usage

  # black-magic-probe:
  #   entry: elec/src/devboards/black_magic_probe.ato:BlackMagicProbe

  # Outlines
  ## These provide simple board shapes
  # boardshapes-gridfinity-3x100mm:
  #   entry: elec/src/boardshapes/boardshape_gridfinity_3x100mm.ato:BoardshapeGridfinity3x100mm

package:
  identifier: atopile/hil
  repository: https://github.com/atopile/hil
  version: "0.4.0"
  authors:
    - name: atopile
      email: hi@atopile.io
  summary: >
    A hardware testing framework - with batteries included
    hardware, drivers, framework and distribution
  license: MIT
  homepage: https://docs.atopile.io/hil/

dependencies:
  - type: registry
    identifier: atopile/st-ldk220
    release: 0.1.0
  - type: registry
    identifier: atopile/saleae-header
    release: 0.1.0
  - type: registry
    identifier: atopile/ti-tca9548a
    release: 0.1.0
  - type: registry
    identifier: atopile/xt-connectors
    release: 0.1.0
  - type: registry
    identifier: atopile/ti-lv284x
    release: 0.1.0
  - type: registry
    identifier: atopile/ti-tps54560x
    release: 0.1.1
  - type: registry
    identifier: atopile/ti-iso1640x
    release: 0.1.0
